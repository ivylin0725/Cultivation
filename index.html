<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喵涵抓老虎客製計算機</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #888;
            --accent-water: #4fc3f7;
            --accent-fire: #ff8a65;
            --accent-wood: #81c784;
            --accent-highlight: #ffca28;
            --accent-danger: #f44336; /* 新增危險警戒的紅色 */
            --border-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--accent-highlight);
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 24px;
            width: 100%;
            max-width: 800px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }

        .input-card {
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .card-header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .card-header h2 {
            margin: 0;
            color: #fff;
            font-size: 1.5rem;
            margin-left: 2em; 
        }

        .input-group {
            display: flex;
            align-items: center;
        }

        .input-group label {
            font-size: 1.2rem;
            margin-right: 16px;
            font-weight: bold;
        }

        .input-group input {
            background-color: #2c2c2c;
            border: 1px solid #555;
            color: #fff;
            font-size: 1.3rem;
            padding: 8px 12px;
            border-radius: 6px;
            width: 180px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: var(--accent-highlight);
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .result-box {
            background-color: #252525;
            border-radius: 8px;
            padding: 16px;
            border-left: 4px solid var(--border-color);
        }

        /* 個別區塊的左側顏色設定 */
        .result-box.water-wood { border-left-color: var(--accent-wood); }
        .result-box.danger-lose { border-left-color: var(--accent-danger); } /* 紅色警告 */
        .result-box.win-normal { border-left-color: var(--accent-highlight); }

        .result-title {
            font-size: 1rem;
            margin-bottom: 8px;
            color: #bbb;
        }

        .result-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #fff;
        }
        
        .result-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* 讓被碾壓的數字特別顯示為紅色 */
        .value-danger {
            color: var(--accent-danger); 
        }
    </style>
</head>
<body>

    <h1>🐈 喵涵抓老虎客製計算機 🐯</h1>

    <div class="container">
        <div class="card input-card">
            <div class="input-group">
                <label for="global-base">我的基礎戰力：</label>
                <input type="number" id="global-base" value="10000" min="0">
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2>秘境</h2>
            </div>

            <div class="results-grid">
                <div class="result-box water-wood">
                    <div class="result-title">碾壓局 (被對方克制) 🪵</div>
                    <div class="result-desc">最壞情況，逆風極限</div>
                    <div class="result-value" id="res-secret-crush">0</div>
                    <div class="result-desc">低於此數值，你穩贏</div>
                </div>
                
                <div class="result-box danger-lose">
                    <div class="result-title">被碾壓局 (我方克制仍輸) 💀</div>
                    <div class="result-desc">最好情況，順風極限</div>
                    <div class="result-value value-danger" id="res-secret-lose">0</div>
                    <div class="result-desc">高於此數值，你必敗</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2>打帖</h2>
            </div>

            <div class="results-grid">
                <div class="result-box win-normal">
                    <div class="result-title">克制局 (我方克制對方) ⚔️</div>
                    <div class="result-desc">屬性優勢加成</div>
                    <div class="result-value" id="res-challenge-win">0</div>
                    <div class="result-desc">可越級擊敗的最高對手</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function calculateAll() {
            const x = parseFloat(document.getElementById('global-base').value) || 0;
            
            // --- 秘境計算 (雙方都有天罡陣 +15%) ---
            
            // 1. 碾壓局 (我方被克制: 1.10, 敵方: 1.20)
            const crushY = x * (1.10 / 1.20);
            document.getElementById('res-secret-crush').innerText = Math.floor(crushY).toLocaleString();
            
            // 2. 被碾壓局 (我方克制對方: 1.20, 敵方被克制: 1.10)
            // 算出來的是「敵方基礎戰力」，超過這個數字，就算我方克制對方也打不贏
            const loseY = x * (1.20 / 1.10);
            document.getElementById('res-secret-lose').innerText = Math.floor(loseY).toLocaleString();

            // --- 打帖計算 (無陣法) ---
            
            // 順風克制 (我方克制對方: 1.05, 敵方: 0.95)
            const winY = x * (1.05 / 0.95);
            document.getElementById('res-challenge-win').innerText = Math.floor(winY).toLocaleString();
        }

        document.getElementById('global-base').addEventListener('input', calculateAll);
        calculateAll();
    </script>
</body>
</html>
