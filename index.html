<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喵涵抓老虎客製計算機</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #888;
            --accent-water: #4fc3f7;
            --accent-fire: #ff8a65;
            --accent-wood: #81c784;
            --accent-highlight: #ffca28;
            --accent-danger: #f44336;
            --border-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--accent-highlight);
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 24px;
            width: 100%;
            max-width: 800px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }

        .input-card {
            display: flex;
            flex-direction: column; /* 改為垂直排列輸入框 */
            align-items: center;
            gap: 16px;
            padding: 20px;
        }

        .card-header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .card-header h2 {
            margin: 0;
            color: #fff;
            font-size: 1.5rem;
            margin-left: 2em; 
        }

        .input-group {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            width: 100%;
            max-width: 400px;
        }

        .input-group label {
            font-size: 1.2rem;
            margin-right: 16px;
            font-weight: bold;
        }

        /* 讓輸入框和下拉選單樣式一致 */
        .input-control {
            background-color: #2c2c2c;
            border: 1px solid #555;
            color: #fff;
            font-size: 1.2rem;
            padding: 8px 12px;
            border-radius: 6px;
            width: 180px;
            outline: none;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        .input-control:focus {
            border-color: var(--accent-highlight);
        }

        /* 秘境專屬的表格樣式 */
        .styled-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .styled-table th, .styled-table td {
            padding: 12px 15px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        .styled-table th {
            background-color: #252525;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: normal;
        }

        .styled-table tbody tr:hover {
            background-color: #2a2a2a; /* 滑鼠移過去會有高亮效果 */
        }

        .styled-table td {
            font-size: 1.4rem;
            font-weight: bold;
            color: #fff;
        }

        /* 表格內的第一個直行（對方天罡等級）小字體 */
        .styled-table td.col-level {
            font-size: 1.1rem;
            color: var(--accent-highlight);
        }

        .value-safe { color: var(--accent-wood); }
        .value-danger { color: var(--accent-danger); }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .result-box {
            background-color: #252525;
            border-radius: 8px;
            padding: 16px;
            border-left: 4px solid var(--border-color);
        }

        .result-box.win-normal { border-left-color: var(--accent-highlight); }
        .result-title { font-size: 1rem; margin-bottom: 8px; color: #bbb; }
        .result-value { font-size: 1.8rem; font-weight: bold; color: #fff; }
        .result-desc { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }
    </style>
</head>
<body>

    <h1>🐈 喵涵抓老虎客製計算機 🐯</h1>

    <div class="container">
        <div class="card input-card">
            <div class="input-group">
                <label for="global-base">我的基礎戰力：</label>
                <input type="number" id="global-base" class="input-control" value="10000" min="0">
            </div>
            <div class="input-group">
                <label for="my-tiangang">我的天罡等級：</label>
                <select id="my-tiangang" class="input-control">
                    <option value="0.03">等級 1 (+3%)</option>
                    <option value="0.05">等級 2 (+5%)</option>
                    <option value="0.07">等級 3 (+7%)</option>
                    <option value="0.10">
